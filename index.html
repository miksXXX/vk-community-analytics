<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VK Analytics Bot</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0B1C3A 0%, #1E3A6F 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 32px;
            padding: 48px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #0B1C3A;
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        .status {
            background: #10B981;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            display: inline-block;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .message {
            color: #4B5563;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .button {
            background: #0B1C3A;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .button:hover {
            background: #1E3A6F;
        }
        .footer {
            margin-top: 32px;
            color: #9CA3AF;
            font-size: 0.8rem;
        }
    </style>
    <meta http-equiv="refresh" content="3;url=/">
</head>
<body>
    <div class="container">
        <div class="status">🟢 Бот активен</div>
        <h1>📊 VK Analytics</h1>
        <div class="message">
            Дашборд загружается...<br>
            Если страница не открылась автоматически — нажмите кнопку ниже.
        </div>
        <a href="/" class="button">🚀 Открыть дашборд</a>
        <div class="footer">
            Бот: bot_1778624444_5154_miksx<br>
            Статус: перезагрузка через 3 секунды...
        </div>
    </div>
</body>
</html>
